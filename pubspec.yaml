name: slotly
description: "Slotly — онлайн-запись и электронная очередь для локального бизнеса."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  timezone: ^0.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
